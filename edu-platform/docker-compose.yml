# Educational Platform Docker Compose
# Target: Hetzner CCX13 (2 dedicated vCPU, 8GB RAM, 80GB SSD)
# Supports: 50 concurrent users
#
# Memory Budget (8GB Total):
# PostgreSQL:     1.5GB
# Moodle:         1.5GB
# Redis:          256MB
# Maxima (x3):    1GB total
# JupyterHub:     512MB
# Jupyter users:  2GB shared
# Code Server:    512MB
# DeepSeek Proxy: 128MB
# Caddy:          128MB
# System/Buffer:  ~500MB

services:
  # ===========================================
  # CADDY - Reverse Proxy with Auto HTTPS
  # ===========================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # POSTGRESQL - Database Server
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    # PostgreSQL tuning for 8GB RAM system
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c max_parallel_maintenance_workers=1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================
  # REDIS - Caching Layer
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # MOODLE - Learning Management System
  # ===========================================
  moodle:
    image: bitnami/moodle:latest
    container_name: moodle
    restart: unless-stopped
    environment:
      # Database configuration
      MOODLE_DATABASE_TYPE: pgsql
      MOODLE_DATABASE_HOST: postgres
      MOODLE_DATABASE_PORT_NUMBER: 5432
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      MOODLE_DATABASE_NAME: ${POSTGRES_MOODLE_DB}
      # Admin configuration
      MOODLE_USERNAME: ${MOODLE_USERNAME}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD}
      MOODLE_EMAIL: ${MOODLE_EMAIL}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME}
      # PHP configuration
      PHP_MEMORY_LIMIT: 512M
      PHP_MAX_UPLOAD: 256M
      PHP_MAX_POST: 256M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_MAX_INPUT_TIME: 300
      # URL configuration
      MOODLE_HOST: learn.${DOMAIN}
      MOODLE_SKIP_BOOTSTRAP: "no"
      MOODLE_REVERSEPROXY: "yes"
      MOODLE_SSLPROXY: "yes"
      # Redis session handling
      MOODLE_REDIS_HOST: redis
      MOODLE_REDIS_PORT: 6379
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata:/bitnami/moodledata
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login/index.php"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

  # ===========================================
  # MAXIMA - Computer Algebra System for STACK
  # ===========================================
  maxima:
    image: ghcr.io/maths/stack-maxima:latest
    container_name: maxima
    restart: unless-stopped
    environment:
      # Pool size reduced for 8GB RAM
      MAXIMA_POOL_SIZE: ${MAXIMA_POOL_SIZE:-3}
      # Timeout for complex calculations (30 seconds)
      MAXIMA_TIMEOUT: 30000
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # JUPYTERHUB - Multi-user Jupyter Server
  # ===========================================
  jupyterhub:
    build:
      context: ./jupyterhub
      dockerfile: Dockerfile
    container_name: jupyterhub
    restart: unless-stopped
    environment:
      JUPYTERHUB_ADMIN: ${JUPYTERHUB_ADMIN}
      JUPYTERHUB_ADMIN_PASSWORD: ${JUPYTERHUB_ADMIN_PASSWORD}
      JUPYTER_MEMORY_LIMIT: ${JUPYTER_MEMORY_LIMIT:-1G}
      JUPYTER_CPU_LIMIT: ${JUPYTER_CPU_LIMIT:-0.5}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_JUPYTER_DB}
      POSTGRES_USER: jupyterhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DOCKER_NETWORK_NAME: edu-platform_backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - jupyterhub_data:/srv/jupyterhub
      - jupyter_users:/home
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/hub/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # CODE-SERVER - VS Code in Browser
  # ===========================================
  code-server:
    image: codercom/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD}
      SUDO_PASSWORD: ${CODE_SERVER_PASSWORD}
      DEFAULT_WORKSPACE: /home/coder/workspace
    volumes:
      - code_server_data:/home/coder
      - ./code-server/config.yaml:/home/coder/.config/code-server/config.yaml:ro
    networks:
      - backend
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # DEEPSEEK PROXY - AI API Gateway
  # ===========================================
  deepseek-proxy:
    build:
      context: ./deepseek-proxy
      dockerfile: Dockerfile
    container_name: deepseek-proxy
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PROXY_API_KEY: ${DEEPSEEK_PROXY_API_KEY}
      RATE_LIMIT_PER_MINUTE: 10
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ===========================================
# NETWORKS
# ===========================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: false  # Required for JupyterHub to spawn containers

# ===========================================
# VOLUMES
# ===========================================
volumes:
  # Caddy
  caddy_data:
  caddy_config:

  # PostgreSQL
  postgres_data:

  # Redis
  redis_data:

  # Moodle
  moodle_data:
  moodledata:

  # JupyterHub
  jupyterhub_data:
  jupyter_users:

  # Code Server
  code_server_data:
